<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jeff Brown Yachts — Viewer</title>
<link rel="icon" href="assets/jby_logo.svg">
<link rel="stylesheet" href="assets/fonts.css">
<style>
:root{--navy:#41647b;--sand:#bdb19d;--line:#e4e8ee;--muted:#6b7784}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;background:#fff;
  font-family:'Myriad Pro',system-ui,sans-serif;font-size:15px;color:#000}
a{color:inherit;text-decoration:none}
.bar{flex:0 0 auto;height:56px;background:var(--navy);color:#fff;display:flex;align-items:center;gap:20px;padding:0 20px}
.bar img{height:28px;filter:brightness(0) invert(1)}
.bar .home{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.85);transition:color .2s}
.bar .home:hover{color:var(--sand)}
.bar select{margin-left:auto;height:34px;max-width:340px;background:rgba(255,255,255,.08);color:#fff;
  border:1px solid rgba(255,255,255,.28);border-radius:2px;padding:0 10px;font-family:inherit;font-size:14px;outline:none}
.bar select option{color:#000}
.bar .open{font-size:13px;letter-spacing:.06em;text-transform:uppercase;border:1px solid rgba(255,255,255,.4);
  padding:8px 14px;border-radius:2px;transition:background .2s,border-color .2s}
.bar .open:hover{background:rgba(255,255,255,.14);border-color:#fff}
.nav-arrows{display:flex;gap:8px}
.nav-arrows button{width:34px;height:34px;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.28);
  border-radius:2px;cursor:pointer;font-size:15px;line-height:1;transition:background .2s}
.nav-arrows button:hover{background:rgba(255,255,255,.18)}
.nav-arrows button:disabled{opacity:.35;cursor:default}
@media(max-width:760px){.bar .home,.nav-arrows{display:none}.bar select{margin-left:0;flex:1}}
iframe{flex:1 1 auto;width:100%;border:0;display:block}
.fallback{padding:40px;color:var(--muted)}
</style>
<link rel="stylesheet" href="./jby-system.css">
<style>
/* === JBY: the header is blue from the first frame === ===
   The hero on this page is light and carries no photograph and no video, so a
   transparent header would be dark type on paper and would then flip to white
   on blue the moment the page moved. It is the blue from the start instead,
   the way the locations page has been since it was built.

   Appended after the page's own styles rather than written into its .nav
   rules, which differ page by page.

   The class is doubled on every selector, and that is not decoration. Every
   one of these pages carries a `.nav:not(.scrolled){...}` rule — the office
   page carries eight of them — and :not() counts its argument, so those are
   (0,2,0) against a plain .nav's (0,1,0). Being later in the file does not
   help against higher specificity. `.nav.nav` is (0,2,0) and later, which
   does. Written the way this codebase already writes it, as in
   `footer .back-top.back-top:hover`.

   .scrolled is left holding the one thing that should still answer the scroll,
   the padding tightening, which each page already defines. */
.nav.nav{
  background:linear-gradient(180deg, rgba(65,100,123,0.82) 0%, rgba(65,100,123,0.92) 100%);
  backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);
  border-bottom:0.5px solid rgba(255,255,255,0.15);
  color:#fff;
}
/* The burger is the one part of the header the pages never agreed on: the
   home page draws it 24 square with three 1px bars, the locations page 40 wide
   and 13 tall, the listing page 34 by 11, the contact page 40 by 12 with 1.5px
   bars, and the menu pages 26 by 12. Six burgers for one site. The home page's
   is the one, here, so every header opens with the same mark. */
.nav.nav .burger{width:24px;height:24px;display:flex;flex-direction:column;
  justify-content:space-between;align-items:stretch;cursor:pointer;
  background:transparent;border:0;padding:0}
.nav.nav .burger span{display:block;height:1px;width:100%;background:#fff;border-radius:0}
.nav.nav .logo img{filter:brightness(0) invert(1)}
.nav.nav .icon{border-color:rgba(255,255,255,0.7);color:#fff;background:transparent}
.nav.nav .icon:hover{background:rgba(255,255,255,0.14)}
.nav.nav .cta{color:#fff;border-color:rgba(255,255,255,0.75);background:transparent}
.nav.nav .cta:hover{background:rgba(255,255,255,0.14);border-color:rgba(255,255,255,0.75)}
</style>
</head>
<body>

<div class="bar">
  <a href="index.html"><img src="assets/jby_logo.svg" alt="Jeff Brown Yachts"></a>
  <a class="home" href="index.html">All pages</a>
  <div class="nav-arrows">
    <button id="prev" title="Previous page">&#8592;</button>
    <button id="next" title="Next page">&#8594;</button>
  </div>
  <select id="picker"></select>
  <a class="open" id="open" target="_blank" rel="noopener">Full page</a>
</div>

<iframe id="frame" title="Page preview"></iframe>

<script src="pages.js"></script>
<script>
const picker = document.getElementById('picker');
const frame  = document.getElementById('frame');
const openBtn= document.getElementById('open');
let current = 0;

let lastGroup = '';
JBY_FLAT.forEach((p, i) => {
  if (p.group !== lastGroup) {
    lastGroup = p.group;
    picker.insertAdjacentHTML('beforeend', `<optgroup label="${p.group}" id="og-${i}"></optgroup>`);
  }
  picker.lastElementChild.insertAdjacentHTML('beforeend', `<option value="${i}">${p.name.replace(/^— /, '')}</option>`);
});

function show(i) {
  current = Math.max(0, Math.min(JBY_FLAT.length - 1, i));
  const p = JBY_FLAT[current];
  const url = JBY_BASE + p.path;
  frame.src = url;
  openBtn.href = url;
  picker.value = current;
  document.title = 'JBY — ' + p.name.replace(/^— /, '');
  history.replaceState(null, '', 'view.html?p=' + encodeURIComponent(p.id));
  document.getElementById('prev').disabled = current === 0;
  document.getElementById('next').disabled = current === JBY_FLAT.length - 1;
}

const wanted = new URLSearchParams(location.search).get('p');
const start = Math.max(0, JBY_FLAT.findIndex(p => p.id === wanted));
show(start);

picker.addEventListener('change', () => show(+picker.value));
document.getElementById('prev').addEventListener('click', () => show(current - 1));
document.getElementById('next').addEventListener('click', () => show(current + 1));
</script>
</body>
</html>
