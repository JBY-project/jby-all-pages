<style data-jby-system>
/* ======================================================================
   JBY design rules
   ----------------------------------------------------------------------
   The rules the client asked for across the whole site, in one place.
   Each page is a standalone site with its own inline <style>, so this
   file is copied into the page's folder and linked *after* that style
   block — last one in wins, and no !important is needed.

   Roll it out with: node design-system/apply.mjs "<page folder>"
   ====================================================================== */

:root{
  /* The brand blue already lives in every page as --navy; these are the
     fallbacks for the few that do not define it. */
  --jby-blue:var(--navy,#41647b);
  --jby-blue-d:var(--navy-d,#365466);
  /* On hover an outlined button drops its rule: the fill carries the
     shape from there. */
  --jby-rule-hover:transparent;

  /* One button, everywhere. */
  --jby-btn-h:48px;
  --jby-btn-pad:0 28px;
  --jby-btn-radius:0;

  /* A white button standing on a photograph or video: a veil the image
     shows through, with white type — not a white slab with dark type. */
  --jby-veil:rgba(255,255,255,0.28);
}

/* ---- 1. One shape and size -------------------------------------------
   Before this, the home page alone carried heights of 40, 44 and 48px
   and four different paddings. */
.nav .cta,
.hero .btn-hero,
.btn-solid,
.btn-outline,
.bento-cta,
.expert .btn,
.event-card .cta,
.loc-modal-cta,
.loc-modal-cta-secondary,
.loc-modal-cta.secondary,
.s-link,
.btn-ghost,
.btn-line,
/* Pages that shrink one of these on their own — the CTA band's ghost
   button and the ports header's link. Same specificity as their rule,
   and this file is read after it. */
.help .btn-ghost,
.expert .btn-ghost,
.ports-head .s-link,
/* The listing, team-member and V1 templates name their buttons
   differently; these are their text buttons. */
.btn-primary,
.btn-basic,
.nav-cta,
.gal-all,
.btn-navy,
.btn-out,
.btn-help,
.help .btn-help,
.nf-actions a,
/* The brand, model and knowledge-centre templates, which run at 48 and
   50 with names of their own. */
.ax-btn,
.btn-md,
.btn-white,
.btn-ghost-light,
.btn-ghost-dark,
.searchbar .btn,
/* Named small, or sitting in a dense column, but each of these is the
   action of its section: "See details" on every event, "View all yachts"
   on the office page, "Book a consultation" in the listing's band. */
.ev-btn,
.cat-cta,
.cta-band button,
.shr-copy,
/* The knowledge centre's event card: the call to action is a span
   inside the card, and the card carries the hover. */
.ecard .ec-cta{
  height:var(--jby-btn-h);
  padding:var(--jby-btn-pad);
  border-radius:var(--jby-btn-radius);
  font-family:'Mesmerize',sans-serif;
  font-weight:300;
  font-size:16px;
  line-height:20px;
  letter-spacing:0;
  text-transform:uppercase;
  display:inline-flex;
  align-items:center;
  gap:10px;
  transition:background .25s,color .25s,border-color .25s;
}

/* The header's search button is square, so it takes the button height on
   both sides — it stood 40 beside a 48 CTA. */
.nav .icon{width:var(--jby-btn-h);height:var(--jby-btn-h)}

/* The event card's button spans the foot of its card rather than sitting
   inline, so it keeps its own width and margin. */
.event-card .cta{display:flex;justify-content:center;margin:24px 20px 20px}

/* The brand carousel's pair is already 48 / 0 28px, so it needs the
   colours only. */

/* ---- 2. Hover turns blue, never black --------------------------------
   Outlined buttons fill with the brand blue and let their rule go. */
.btn-outline:hover,
.loc-modal-cta-secondary:hover,
.loc-modal-cta.secondary:hover,
.s-link:hover,
.btn-line:hover,
/* The compact controls keep their own size. .terms button is a
   segmented choice of loan term and .chip is a tag, neither being a call
   to action; .btn-sm sits beside the 36px bell in the listing's event
   card, where the whole row is deliberately small. Only their colour is
   the rule's business. */
.ev-btn:hover,
.cat-cta:hover,
.btn-basic:hover,
.btn-out:hover,
.btn-sm:hover,
.shr-copy:hover,
.chip:hover,
.terms button:hover,
.nf-actions a.ghost:hover,
.ax-btn-ghost-dark:hover,
.btn-ghost-dark:hover,
/* Beats the page's own `.nav:not(.scrolled) .cta:hover`, which outranks a
   plain `.nav .cta:hover` and would otherwise keep its grey wash. */
.nav:not(.scrolled) .cta:hover{
  background:var(--jby-blue);
  border-color:var(--jby-rule-hover);
  color:#fff;
}

/* Buttons already filled blue deepen rather than change colour. The
   label goes white with them: a few of these rest as white with black
   type, and the fill underneath it turns dark. */
.btn-solid:hover,
.event-card .cta:hover,
.loc-modal-cta:hover,
.btn-primary:hover,
.btn-navy:hover,
.gal-all:hover,
.nf-actions a.solid:hover{
  background:var(--jby-blue-d);
  color:#fff;
}

/* ---- 3. White buttons over a photograph or video ---------------------
   A veil the picture shows through, with white type. The blur is what
   keeps white type legible: 28% white over a bright frame is otherwise
   white on near-white, and the type reads grey. */
.hero .btn-hero,
.builders .a.solid,
.v-cta{
  background:var(--jby-veil);
  color:#fff;
  border:0;
  -webkit-backdrop-filter:blur(8px);
  backdrop-filter:blur(8px);
}

/* On media the hover is the solid blue too — no translucency. */
.nav .cta:hover,
.bento-cta:hover,
.expert .btn:hover,
.hero .btn-hero:hover,
.builders .a.solid:hover,
.builders .a.ghost:hover,
.btn-ghost:hover,
.nav-cta:hover,
.cta-band button:hover,
.ax-btn-light:hover,
.ax-btn-ghost-light:hover,
.btn-white:hover,
.btn-ghost-light:hover,
.lb-btn:hover,
.v-cta:hover{
  background:var(--jby-blue);
  border-color:var(--jby-rule-hover);
  color:#fff;
}

/* The card owns the hover, not the button inside it, so this is written
   the way the page writes it — at 0,3,0, above the white it used. */
.ecard:hover .ec-cta{
  background:var(--jby-blue);
  border-color:var(--jby-rule-hover);
  color:#fff;
}

/* The knowledge centre's band stacks its two buttons: .cb-inner is
   720px wide with 40px of padding, leaving 640 for a row that needs 663.
   It wrapped before the buttons took the shared padding too. Rather than
   widen the column — which would re-wrap the paragraph above — the row
   alone reaches into the padding. It still wraps on a narrow screen. */
@media (min-width:760px){
  .cta-band .actions{margin-left:-40px;margin-right:-40px}
}

/* The brand-blue CTA band. It runs under three names — .expert, .help
   and .cta-band — and it is painted #41647b, the very colour the hover
   fills with. A button standing on it would disappear into its own
   background, so inside the band the hover goes one step down.

   :is() keeps this one rule instead of a band-by-class-by-class list,
   and lands at 0,3,0 — above the plain hovers above, below nothing. */
:is(.expert, .help, .cta-band)
:is(.btn, .btn-ghost, .btn-outline, .btn-line, .btn-help, .btn-solid,
    .btn-primary, .btn-white, .btn-ghost-light, .btn-ghost-dark,
    .ax-btn, .cta, .s-link, button):hover{
  background:var(--jby-blue-d);
  color:#fff;
}

/* The round and square icon affordances — carousel arrows, the scroll
   arrow — keep their own 44px geometry: they are not buttons in the
   shape-and-size sense. The hover rule still reaches them, and the scroll
   arrow is one of the two that went black. */
/* The icon affordances: the header's search, the carousel arrows, the
   scroll arrow, back-to-top. They keep their own 40–48px geometry — they
   are not buttons in the shape-and-size sense — but the hover rule still
   reaches them.

   :is() rather than a plain list, so this sits at 0,3,0. A page can carry
   its own `.ax-listings .cards-scroll-arr:hover` at that weight, and a
   0,2,0 rule here would lose to it however late this file is read. */
:is(.nav .icon, .hero-arr, .builders-arr, .cards-scroll-arr,
    .back-top, .to-top, .ax-model-arr, .pe-nav, .strip-arr,
    .lb-btn, .show-arrow):hover{
  background:var(--jby-blue);
  border-color:var(--jby-rule-hover);
  color:#fff;
}
</style>
</head>
<body data-kc="events" data-hero="1">

<div data-site-header></div>

<!-- GRADIENT HERO + FLOATING PHOTO -->
<section class="video-hero">
  <div class="wrap">
    <nav class="dh-crumbs" aria-label="Breadcrumb"><ol>
      <li><a href="index.html#all">Knowledge Center</a></li><li class="sep">/</li>
      <li><a href="index.html#events">Past Events</a></li><li class="sep">/</li>
      <li aria-current="page" id="e-crumb">Event</li>
    </ol></nav>
  </div>
</section>
<div class="video-stage reveal in"><div class="videoframe"><img id="e-hero" src="" alt="" /></div></div>

<!-- TITLE + META + DESCRIPTION -->
<section class="video-body">
  <div class="vb-inner">
    <h1 id="e-title">Event Recap</h1>
    <p class="v-sub" id="e-meta"></p>
    <p class="v-desc-long" id="e-desc"></p>
  </div>
</section>

<!-- GALLERY: Photos then Videos -->
<section class="ev-galleries">
  <div class="evgal" id="gal-photos" aria-label="Event photos"></div>
  <div class="evgal" id="gal-videos" aria-label="Event videos"></div>
</section>

<div data-site-cta></div>
<div data-site-footer></div>

<!-- LIGHTBOX (photo / video viewer) -->
<div class="lightbox" id="lightbox" aria-hidden="true">
  <button class="lb-btn lb-close" type="button" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  <button class="lb-btn lb-prev" type="button" aria-label="Previous"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m15 6-6 6 6 6"/></svg></button>
  <button class="lb-btn lb-next" type="button" aria-label="Next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m9 6 6 6-6 6"/></svg></button>
  <div class="lb-stage"><div class="lb-media" id="lb-media"></div><span class="lb-count"></span></div>
</div>

<script>
/* Event detail — populate from ?e=<slug> */
(function(){
  var PHOTOS = ["consult-overlook.jpg","brand-riva.webp","brand-axopar.jpg","brand-wally.jpg","brand-pershing.jpg","hero-detail.jpg","card_crew.jpg"];
  var VIDS = [
    {id:"w0ptcR-tTSQ",img:"brand-riva.webp"},
    {id:"-jKF--eEPcs",img:"brand-axopar.jpg"},
    {id:"UK9PYInX22U",img:"brand-wally.jpg"},
    {id:"dWhl8WauQQw",img:"band.jpg"}
  ];
  var E = {
    "lake-tahoe":{t:"Lake Tahoe Concours d'Elegance",d:"August 2026",l:"Lake Tahoe, CA",img:"ev_pebble.jpg",vid:"",
      desc:"Jeff Brown Yachts hosted the Riva hospitality tent at the Lake Tahoe Concours d'Elegance, where Riva was the featured marque for 2026. Owners and guests joined our team on the water for private walkthroughs and first looks at the fleet."},
    "san-diego":{t:"San Diego International Boat Show",d:"June 2026",l:"San Diego, CA",img:"marina-sandiego.jpg",vid:"",
      desc:"Jeff Brown Yachts returned to the San Diego International Boat Show on our home waters at Shelter Island, with a curated line-up of the brands we represent and our specialists on hand throughout the show."},
    "miami":{t:"Miami International Boat Show",d:"February 2026",l:"Miami, FL",img:"brand-pershing.jpg",vid:"",
      desc:"Jeff Brown Yachts brought a curated line-up to the Miami International Boat Show across its new 2026 in-water venues, with private tours and sea trials arranged throughout the week."},
    "mid-atlantic":{t:"Mid-Atlantic Boat Show",d:"February 2026",l:"Baltimore, MD",img:"brand-axopar.jpg",vid:"",
      desc:"Jeff Brown Yachts showed the largest selection of Axopars at the Mid-Atlantic Boat Show, giving visitors a close look at the range across a single, focused display."},
    "charleston":{t:"Charleston Boat Show",d:"January 2026",l:"Charleston, SC",img:"marina-newport.jpg",vid:"",
      desc:"Jeff Brown Yachts joined the Charleston Boat Show, close to our newest East Coast office, and welcomed local owners and prospective buyers aboard."},
    "fort-lauderdale":{t:"Fort Lauderdale International Boat Show",d:"October 2025",l:"Fort Lauderdale, FL",img:"event_flibs.jpg",vid:"",
      desc:"A standout week for Jeff Brown Yachts at the world's largest in-water boat show, with private tours across the fleet and our team on the docks throughout."},
    "sausalito":{t:"Sausalito Boat Show (4th Annual)",d:"September 2025",l:"Sausalito, CA",img:"ev_sausalito.jpg",vid:"",
      desc:"Jeff Brown Yachts joined the 4th Annual Sausalito Boat Show at Clipper Yacht Harbor on the bay, with Axopar and BRABUS on the water for the weekend."},
    "carolinas":{t:"Axopar & BRABUS Carolinas Adventure",d:"July 2024",l:"The Carolinas",img:"brand-axopar.jpg",vid:"UK9PYInX22U",
      desc:"An invite-only coastal journey created by Jeff and Karen Brown, part of the Axopar & BRABUS Adventure series, with a small group of owners running the fleet along the Carolina coast."}
  };
  function param(n){ var m=new RegExp("[?&]"+n+"=([^&]+)").exec(location.search); return m?decodeURIComponent(m[1]):""; }
  var slug = param("e"); if(!E[slug]) slug = "fort-lauderdale";
  var e = E[slug];

  document.getElementById("e-hero").src = "assets/img/"+e.img;
  document.getElementById("e-crumb").textContent = e.t;
  document.getElementById("e-title").textContent = e.t;
  document.getElementById("e-meta").textContent = e.d + " · " + e.l;
  document.getElementById("e-desc").textContent = e.desc;
  document.title = e.t + " — Jeff Brown Yachts";

  function esc(s){ return String(s).replace(/"/g,"&quot;"); }
  var chev = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">';
  var arrows = '<button class="eg-arrow prev" aria-label="Previous">'+chev+'<path d="m15 6-6 6 6 6"/></svg></button>'
             + '<button class="eg-arrow next" aria-label="Next">'+chev+'<path d="m9 6 6 6-6 6"/></svg></button>';

  /* Photos gallery */
  var pt = PHOTOS.map(function(im,i){
    return '<button class="eg-thumb'+(i===0?' active':'')+'" data-full="assets/img/'+im+'"><img src="assets/img/'+im+'" alt="" /></button>';
  }).join("");
  document.getElementById("gal-photos").innerHTML =
    '<div class="eg-hero"><img src="assets/img/'+PHOTOS[0]+'" alt="" /></div>'
    + arrows
    + '<div class="eg-word">Photos</div>'
    + '<div class="eg-thumbs">'+pt+'</div>';

  /* Videos gallery — event recap first (if any), then a shared set */
  var vids = VIDS.slice();
  if(e.vid && !vids.some(function(v){return v.id===e.vid;})) vids.unshift({id:e.vid,img:e.img});
  var vt = vids.map(function(v,i){
    return '<button class="eg-thumb'+(i===0?' active':'')+'" data-full="assets/img/'+v.img+'" data-vid="'+v.id+'"><img src="assets/img/'+v.img+'" alt="" /></button>';
  }).join("");
  document.getElementById("gal-videos").innerHTML =
    '<div class="eg-hero"><img class="eg-poster" src="assets/img/'+vids[0].img+'" alt="" /><iframe class="eg-embed" src="https://www.youtube.com/embed/'+vids[0].id+'?autoplay=1&mute=1&loop=1&playlist='+vids[0].id+'&controls=0&modestbranding=1&rel=0&playsinline=1" title="Video preview" allow="autoplay; encrypted-media" frameborder="0"></iframe></div>'
    + arrows
    + '<div class="eg-word">Videos</div>'
    + '<div class="eg-thumbs">'+vt+'</div>';
})();
</script>
<script src="assets/app.js"></script>
</body>
