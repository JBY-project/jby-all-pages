<!-- Sirena Yachts, the white lockup from the header of sirenayachts.com
     (sirena-yachts_whitelogo.svg). It replaces a placeholder that was not a
     logo at all: an SVG that simply set the word "Sirena" in Georgia italic.

     This is a stacked mark — the wave above, SIRENA YACHTS below — so it is
     1.93:1 where the other brands in the carousel are wide single-line
     wordmarks. It carries its own white fill through .cls-1, which is why the
     file keeps its <style> block. -->
